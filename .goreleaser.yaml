project_name: terraform-provider-artifact

before:
  hooks:
    - go mod tidy

builds:
  - id: terraform-provider
    main: .
    binary: terraform-provider-artifact
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - format: zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - terraform-provider-artifact

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user={{ .Env.GPG_FINGERPRINT }}"
      - "--output={{ .Signature }}"
      - "--detach-sign"
      - "{{ .Artifact }}"

release:
  github:
    owner: YOUR_GITHUB_ORG
    name: terraform-provider-artifact