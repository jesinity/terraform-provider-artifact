name: test

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detection and coverage
        run: go test -race -cover ./...
      - name: Static checks
        run: go vet ./...

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        terraform: ["1.5.7", "1.16.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Terraform acceptance tests
        env:
          TF_ACC: "1"
        run: TF_ACC_TERRAFORM_PATH="$(command -v terraform)" go test -race ./internal/provider -run TestAcc -count=1 -timeout=15m
